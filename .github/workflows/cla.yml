name: cla

# Asks first-time contributors to sign CLA.md (needed for dual licensing) and records signatures
# in signatures/cla.json on the `cla-signatures` branch.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The maintainer and the bots that open totalmod PRs don't need to sign. `claude` appears
          # as a co-author on the maintainer's AI-assisted commits (Co-Authored-By trailer).
          allowlist: sumanprime,claude,github-actions[bot],dependabot[bot],totalmod[bot]

  # `claude` is allowlisted above because it co-authors the maintainer's AI-assisted commits. Git
  # lets anyone author commits as Claude, so without this guard a PR whose commits are all
  # "by Claude" would pass the CLA check with nobody signing. Require a real, non-bot author
  # unless the maintainer opened the PR.
  authors:
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Require a human commit author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          OPENER: ${{ github.event.pull_request.user.login }}
          MAINTAINER: sumanprime
        run: |
          if [ "$OPENER" = "$MAINTAINER" ]; then
            echo "Opened by the maintainer."
            exit 0
          fi
          # Commit authors (including Co-Authored-By trailers) by GitHub login; "(no account)"
          # when the email is not linked to one. That still counts as a person, who must sign.
          query='query($owner: String!, $name: String!, $pr: Int!) {
            repository(owner: $owner, name: $name) { pullRequest(number: $pr) {
              commits(first: 250) { nodes { commit { authors(first: 20) { nodes { user { login } } } } } }
            } } }'
          logins='[.data.repository.pullRequest.commits.nodes[].commit.authors.nodes[] | .user.login // "(no account)"] | unique | .[]'
          authors=$(gh api graphql -f query="$query" -F owner="${REPO%%/*}" -F name="${REPO#*/}" -F pr="$PR" --jq "$logins")
          echo "Commit authors:"
          echo "$authors"
          people=$(echo "$authors" | grep -v -x -E 'claude|.+\[bot\]' || true)
          if [ -z "$people" ]; then
            echo "::error::Every commit in this PR is authored by Claude or a bot. Commit under your own GitHub account (keeping Co-Authored-By: Claude is fine) so the CLA can be signed."
            exit 1
          fi
          echo "Human authors (asked to sign the CLA by the cla job):"
          echo "$people"

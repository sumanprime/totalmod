# totalmod.config.yaml: generated by `npx totalmod init`.
# This generated file is yours to change: MIT-0 licensed (templates/LICENSE in the totalmod repo).
# Enforced by deterministic CI checks, not by prompts. Run `npx totalmod doctor` after edits.
model: claude-sonnet-5-5
requesters: all # all | paying | a list of user ids
budget:
  perRequestUsd: 3
  monthlyUsd: 100
iterations:
  max: 3
paths:
  allowed: ["{{src}}app/**", "{{src}}components/**", "{{src}}lib/**"]
  # Always blocked as well: **/auth/**, **/billing/**, **/migrations/**, .env*, .github/**
  blocked: []
  maxChangedLines: 600
flags:
  file: flags/totalmod.flags.json
  removeAfterDays: 14
telemetry: true # set false or DO_NOT_TRACK=1 to disable

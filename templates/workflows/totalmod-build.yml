# This generated file is yours to change: MIT-0 licensed (templates/LICENSE in the totalmod repo).
# Builds a confirmed spec on a branch: policy check -> Claude Code -> path check -> draft PR.
name: totalmod-build

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: totalmod-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'totalmod:build') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, 'totalmod:iterate'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pushes made with the default GITHUB_TOKEN don't trigger CI on the draft PR.
          token: ${{ secrets.TOTALMOD_GITHUB_TOKEN }}
      - uses: sumanprime/totalmod/action@v0
        with:
          # The agent gets only these two credentials. Never add production secrets here.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.TOTALMOD_GITHUB_TOKEN }}
          # The account your totalmod server files issues as (the token owner or your GitHub App).
          trusted_actors: ${{ vars.TOTALMOD_TRUSTED_ACTORS }}

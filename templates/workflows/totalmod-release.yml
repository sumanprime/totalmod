# Generated by `npx totalmod init`.
# This generated file is yours to change: MIT-0 licensed (templates/LICENSE in the totalmod repo).
# Runs only after a human acts: merge (flag on for the requester), rollout labels
# (totalmod:rollout-<n>, totalmod:ga, totalmod:off), close without merging (cleanup), and a daily
# pass that opens a PR removing flags that have been on for everyone long enough.
name: totalmod-release

on:
  pull_request:
    types: [closed, labeled]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: totalmod-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.event.pull_request.head.ref, 'totalmod/req-')
    runs-on: ubuntu-latest
    outputs:
      cleanup_req: ${{ steps.release.outputs.cleanup_req }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The flags file lives on the default branch, whatever triggered the run.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.TOTALMOD_GITHUB_TOKEN }}
      - id: release
        uses: sumanprime/totalmod/action/release@v0
        with:
          github_token: ${{ secrets.TOTALMOD_GITHUB_TOKEN }}

  remove-flag:
    needs: release
    if: needs.release.outputs.cleanup_req != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.TOTALMOD_GITHUB_TOKEN }}
      - uses: sumanprime/totalmod/action@v0
        with:
          task: remove-flag
          req_id: ${{ needs.release.outputs.cleanup_req }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.TOTALMOD_GITHUB_TOKEN }}
          trusted_actors: ${{ vars.TOTALMOD_TRUSTED_ACTORS }}
